spring.application.name=Todo-App
server.port=8081
# ==========================================
# MySQL Database Connection Settings
# ==========================================
# 1. Database URL (Replace 'your_database_name' with your actual DB name)
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=UTC

# 2. Database Credentials
spring.datasource.username=root
spring.datasource.password=root

# 3. MySQL Driver Class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configurations
# ==========================================
# 4. DDL Auto: update (updates schema), create (recreates on startup), validate, or none
spring.jpa.hibernate.ddl-auto=update

# 5. Show executed SQL queries in the console log
spring.jpa.show-sql=true

# 6. Hibernate Dialect for MySQL (Optional for newer Spring Boot versions as it auto-detects)
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

